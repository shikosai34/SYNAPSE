name: Temporary CI dependency repair
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: write
jobs:
  regenerate-lock:
    if: github.event.pull_request.head.repo.full_name == 'shikosai34/SYNAPSE' && github.head_ref == 'codex/nav-sticky-fit'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.13"
      - name: Upgrade known vulnerable dependencies and regenerate lockfile
        run: |
          node <<'NODE'
          const fs = require('fs');
          const update = (path, callback) => {
            const obj = JSON.parse(fs.readFileSync(path, 'utf8'));
            callback(obj);
            fs.writeFileSync(path, JSON.stringify(obj, null, 2) + '\n');
          };
          update('package.json', p => {
            p.workspaces.catalog['better-auth'] = '1.7.16';
            p.workspaces.catalog.zod = '^4.6.7';
            p.dependencies.zod = '^4.6.7';
            p.overrides.undici = '7.30.1';
            p.overrides.vite = '6.4.5';
          });
          update('apps/app/package.json', p => {
            p.dependencies['@better-auth/passkey'] = '1.7.16';
            p.devDependencies.vite = '^6.4.5';
          });
          update('packages/auth/package.json', p => {
            p.dependencies['@better-auth/passkey'] = '1.7.16';
          });
          update('apps/api/package.json', p => {
            delete p.devDependencies['@cloudflare/vitest-pool-workers'];
            p.devDependencies['@cloudflare/vitest-plugin'] = '1.4.11';
          });
          for (const path of ['apps/api/vitest.config.ts', 'apps/api/tsconfig.json', 'apps/api/test/env.d.ts']) {
            fs.writeFileSync(path, fs.readFileSync(path, 'utf8').replaceAll('@cloudflare/vitest-pool-workers', '@cloudflare/vitest-plugin'));
          }
          NODE
          bun install
          bun run audit:dependencies || true
          git rm -f .github/workflows/ci-dependency-refresh.yml
          git add package.json apps/app/package.json packages/auth/package.json apps/api/package.json apps/api/vitest.config.ts apps/api/tsconfig.json apps/api/test/env.d.ts bun.lock
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "fix(ci): upgrade vulnerable dependencies and regenerate lockfile"
          git push origin HEAD:codex/nav-sticky-fit
