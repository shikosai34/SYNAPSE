name: Close issues on dev merge

on:
  pull_request:
    types: [closed]

permissions:
  issues: write
  pull-requests: read

jobs:
  close-referenced-issues:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'dev'
    runs-on: ubuntu-latest
    steps:
      # 2026-10-08: `main` is the default branch, so GitHub's built-in closing keywords do not close Issues when feature PRs merge into `dev`.
      - name: Close completed issues referenced by the PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, "utf8"));
          const pullRequest = event.pull_request;
          const repository = process.env.GITHUB_REPOSITORY;
          const [owner, repo] = repository.split("/");
          const headers = {
            "Accept": "application/vnd.github+json",
            "Authorization": `Bearer ${process.env.GITHUB_TOKEN}`,
            "User-Agent": "OpenAI File Downloader, XaiImageApiFetch/1.0",
            "X-GitHub-Api-Version": "2022-11-28",
          };

          // Only explicit completion keywords close Issues; plain references remain open for partial work.
          const references = [...(pullRequest.body ?? "").matchAll(
            /\b(?:close[sd]?|fix(?:es|ed)?|resolve[sd]?)\s+(?:(?<repository>[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+))?#(?<number>\d+)\b/gi,
          )];
          const issueNumbers = new Set();
          for (const reference of references) {
            const referencedRepository = reference.groups.repository;
            if (referencedRepository && referencedRepository.toLowerCase() !== repository.toLowerCase()) {
              continue;
            }
            issueNumbers.add(reference.groups.number);
          }

          async function request(path, options = {}) {
            const response = await fetch(`${process.env.GITHUB_API_URL}${path}`, {
              ...options,
              headers: { ...headers, ...options.headers },
            });
            if (!response.ok) {
              throw new Error(`GitHub API ${options.method ?? "GET"} ${path} failed: ${response.status} ${await response.text()}`);
            }
            return response.status === 204 ? null : response.json();
          }

          async function main() {
            for (const issueNumber of issueNumbers) {
              const issuePath = `/repos/${owner}/${repo}/issues/${issueNumber}`;
              const issue = await request(issuePath);
              if (issue.pull_request || issue.state !== "open") {
                console.log(`Skipping #${issueNumber}: it is not an open Issue.`);
                continue;
              }

              await request(`${issuePath}/comments`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  body: `Merged PR #${pullRequest.number} into \`dev\`; closing this Issue because the PR used an explicit completion keyword.`,
                }),
              });
              await request(issuePath, {
                method: "PATCH",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ state: "closed", state_reason: "completed" }),
              });
              console.log(`Closed #${issueNumber} from merged PR #${pullRequest.number}.`);
            }
          }

          main().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
