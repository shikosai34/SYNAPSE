name: Quality

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

# 2026-10-03: PR では本番 secret を渡さず、D1 は workerd 内の隔離 DB だけを使う。
permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.13"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Check dependency security
        run: bun run audit:dependencies
      - name: Verify audit tooling
        run: bun run test:tooling
      - name: Typecheck
        run: bun run check-types --force
      # 全 migration を新規 D1 へ適用してから API 統合テストを実行する。
      - name: Test Worker migrations and frontend behavior
        run: bun run test --force
      # API の build は wrangler deploy --dry-run。アップロード・本番 DB 接続はしない。
      - name: Build SPA and Worker bundle
        run: bun run build --force
      - name: Verify generated files were not changed
        run: git diff --exit-code -- bun.lock packages/db/src/migrations
